<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Destiny life play</title>
  </head>

  <body>
    <h1>DESTINY LIFE</h1>
    <p>Descubra seu Destino</p>
    <h2>Idade para casar</h2>

    <input type="number" id="idade" min="1" />
    <h2>Pretendentes</h2>

    <input type="text" id="pretendente1" placeholder="Pretendente 1" />

    <input type="text" id="pretendente2" placeholder="Pretendente 2" />

    <input type="text" id="pretendente3" placeholder="Pretendente 3" />

    <h2>Cidades</h2>

    <input type="text" id="cidade1" placeholder="Cidade 1" />

    <input type="text" id="cidade2" placeholder="Cidade 2" />

    <input type="text" id="cidade3" placeholder="Cidade 3" />
    <br /><br />

    <button id="btnDestino">Descobrir Destino</button>
    resultado do botão destino
    <h2>Resultado</h2>
    
    <p>
      💍
      <strong id="resultadoPretendente">-</strong>
    </p>

    <p>
      🏙️ Cidade:
      <strong id="resultadoCidade">-</strong>
    </p>

    <p>
      👶 Filhos:
      <strong id="resultadoFilhos">-</strong>
    </p>

    <p>
      💰 Status:
      <strong id="resultadoStatus">-</strong>
    </p>
<!--dados-->
    <script src="./js/data.js"></script>
<!--engine-->
    <script src="./js/game.js"></script>
<!--interface-->
    <script src="./js/app.js"></script>

  </body>
</html>
