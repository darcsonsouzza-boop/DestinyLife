<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Destiny life play</title>
  </head>

  <body>
    <section id="telaFormulario">
      <h1>DESTINY LIFE</h1>
      <p>Descubra seu Destino</p>
      <h2>Idade para casar</h2>

      <input type="number" id="idade" min="1" placeholder="18 á 80 anos" />
      <h2>Pretendentes</h2>

      <input type="text" id="pretendente1" />

      <input type="text" id="pretendente2" />

      <input type="text" id="pretendente3" />

      <h2>Cidades</h2>

      <input type="text" id="cidade1" placeholder="Cidade 1" />

      <input type="text" id="cidade2" placeholder="Cidade 2" />

      <input type="text" id="cidade3" placeholder="Cidade 3" />
      <br /><br />

      <button id="btnDestino">Descobrir Destino</button>

      <h2>O Destino escolheu que !</h2>
      <p id="mensagemErro"></p>
      <p id="narrativa"></p>

      <p>
        💍
        <strong id="resultadoPretendente">-</strong>
      </p>

      <p>
        🏙️
        <strong id="resultadoCidade">-</strong>
      </p>

      <p>
        👶
        <strong id="resultadoFilhos">-</strong>
      </p>

      <p>
        💰
        <strong id="resultadoStatus">-</strong>
      </p>
    </section>

    <section id="telaConsultando">
      <h2>consultado</h2>
    </section>

    <section id="telaAnimacao">
      <div id="universoDestino">
        <div class="pretendente">Fernanda</div>

        <div class="cidade">Curitiba</div>

        <div class="filhos">2</div>

        <div class="status">Muito feliz</div>
      </div>
    </section>

    <section id="telaResultado">
      <h2>Fim de jogo</h2>
    </section>

    <!--dados-->
    <script src="./js/data.js"></script>
    <!--engine-->
    <script src="./js/game.js"></script>
    <!--interface-->
    <script src="./js/app.js"></script>
  </body>
</html>
